<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择CD</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fff7f0 0%, #ffe6ef 45%, #f8f8ff 100%);
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .page {
      width: min(100%, 520px);
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.12);
      padding: 28px 24px;
      text-align: center;
    }
    .page h1 {
      margin: 0 0 14px;
      color: #d63f63;
      font-size: 26px;
    }
    .page p {
      color: #6b7280;
      line-height: 1.7;
      margin: 0 0 22px;
    }
    .cd-card {
      border: 1px solid #f2dbe5;
      border-radius: 18px;
      padding: 18px;
      display: grid;
      gap: 16px;
      align-items: center;
      background: #fff7fb;
    }
    .cd-card img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin: 0 auto;
    }
    .cd-card h2 {
      margin: 0;
      font-size: 20px;
      color: #2f2f2f;
    }
    .cd-card button {
      width: 100%;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .button-secondary {
      background: #f8f5f8;
      color: #6b7280;
      border: 1px solid #e5dce2;
    }
    .status {
      color: #6b7280;
      font-size: 14px;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>选择CD</h1>
    <p>你可以放入最多一张CD，打开包裹时会自动播放这首歌。</p>
    <div class="cd-card">
      <img src="./cd.png" alt="CD" />
      <h2>晴天</h2>
      <p>这首歌会在收件人打开包裹时自动播放。</p>
      <button id="selectCdBtn" class="btn">选择这张CD</button>
      <div class="status" id="statusText">MP3将在此页面加载，避免主页面卡顿。</div>
    </div>
    <div class="actions">
      <button id="cancelBtn" class="btn button-secondary">返回编辑</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'virtualGiftSelectedCD';
    const cdList = [
      { key: 'qingtian', label: '晴天', file: './CDs/qingtian.mp3' },
      { key: 'luohualiushui', label: '落花流水', file: './CDs/luohualiushui.mp3' },
      { key: 'jifenzhiji', label: '几分之几', file: './CDs/jifenzhiji.mp3' }
    ];

    const listContainer = document.createElement('div');
    listContainer.style.display = 'grid';
    listContainer.style.gap = '12px';
    listContainer.style.marginTop = '14px';

    let previewAudio = null;
    let currentSelection = null;

    function createCdRow(cd) {
      const row = document.createElement('div');
      row.className = 'cd-card';
      const img = document.createElement('img');
      img.src = './cd.png';
      img.alt = cd.label;
      const h2 = document.createElement('h2');
      h2.textContent = cd.label;
      const p = document.createElement('p');
      p.textContent = '点击试听或确认选择这张 CD。';
      const actions = document.createElement('div');
      actions.className = 'actions';
      const playBtn = document.createElement('button');
      playBtn.className = 'btn';
      playBtn.textContent = '试听';
      const selectBtn = document.createElement('button');
      selectBtn.className = 'btn';
      selectBtn.textContent = '选择这张CD';
      actions.appendChild(playBtn);
      actions.appendChild(selectBtn);
      row.appendChild(img);
      const meta = document.createElement('div');
      meta.appendChild(h2);
      meta.appendChild(p);
      row.appendChild(meta);
      row.appendChild(actions);

      playBtn.addEventListener('click', () => {
        if (previewAudio) {
          previewAudio.pause();
          previewAudio = null;
        }
        previewAudio = new Audio(cd.file);
        previewAudio.preload = 'auto';
        previewAudio.currentTime = 0;
        previewAudio.play().catch(() => {});
      });

      selectBtn.addEventListener('click', () => {
        localStorage.setItem(STORAGE_KEY, cd.key);
        currentSelection = cd.key;
        statusText.textContent = `已选中 ${cd.label}，即将返回编辑页`;
        setTimeout(() => {
          window.location.href = './index.html';
        }, 600);
      });

      return row;
    }

    cdList.forEach((cd) => listContainer.appendChild(createCdRow(cd)));
    document.body.querySelector('.page').insertBefore(listContainer, document.body.querySelector('.actions'));

    const cancelBtnEl = document.getElementById('cancelBtn');
    const statusText = document.getElementById('statusText');
    if (cancelBtnEl) cancelBtnEl.addEventListener('click', () => { window.location.href = './index.html'; });
  </script>
</body>
</html>
