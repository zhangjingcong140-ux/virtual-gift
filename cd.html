<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择CD</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="3D神秘包裹" />
  <meta property="og:image" content="https://zhangjingcong140-ux.github.io/virtual-gift/sharecover.png" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fff7f0 0%, #ffe6ef 45%, #f8f8ff 100%);
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .page {
      width: min(100%, 620px);
      max-width: 100%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.12);
      padding: 28px 24px;
      text-align: center;
    }
    .page h1 {
      margin: 0 0 16px;
      color: #d63f63;
      font-size: 30px;
    }
    .page p {
      color: #6b7280;
      line-height: 1.9;
      margin: 0 0 24px;
      font-size: 16px;
    }
    .cd-card {
      border: 1px solid #f2dbe5;
      border-radius: 20px;
      padding: 18px 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      background: #fff7fb;
      min-height: 104px;
    }
    .cd-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      flex: 0 0 80px;
      border-radius: 12px;
      background: white;
      padding: 10px;
    }
    .cd-meta {
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
    }
    .cd-meta h2 {
      margin: 0;
      font-size: 20px;
      color: #2f2f2f;
      line-height: 1.3;
      white-space: normal;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cd-meta p {
      margin: 8px 0 0 0;
      font-size: 15px;
      color: #6b7280;
      line-height: 1.6;
    }
    .cd-card .actions {
      margin-top: 0;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 160px;
    }
    .cd-card .btn {
      padding: 12px 14px;
      font-size: 15px;
      min-width: 94px;
      border-radius: 12px;
    }
    .actions {
      margin-top: 22px;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    @media (max-width: 520px) {
      body {
        padding: 14px;
      }
      .page {
        padding: 20px 14px;
      }
      .cd-card {
        flex-wrap: wrap;
        padding: 18px 14px;
        min-height: auto;
        gap: 14px;
      }
      .cd-card img {
        width: 72px;
        height: 72px;
        flex: 0 0 72px;
      }
      .cd-meta h2 {
        font-size: 18px;
      }
      .cd-meta p {
        font-size: 15px;
      }
      .cd-card .actions {
        width: 100%;
        justify-content: space-between;
      }
      .cd-card .btn {
        flex: 1 1 32%;
        min-width: 90px;
        padding: 12px 10px;
      }
    }
    .button-secondary {
      background: #f8f5f8;
      color: #6b7280;
      border: 1px solid #e5dce2;
    }
    .status {
      color: #6b7280;
      font-size: 14px;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>选择CD</h1>
    <p>你可以放入最多一张CD，打开包裹时会自动播放这首歌。</p>
    <div id="cdListPlaceholder"></div>
    <div class="status" id="statusText">MP3将在此页面加载，避免主页面卡顿。</div>
    <!-- per-row 返回按钮 will be shown on each CD row; removed global return button -->
  </div>

  <script>
    const STORAGE_KEY = 'virtualGiftSelectedCD';
    const cdList = [
      { key: 'qingtian', label: '晴天', file: './CDs/qingtian.mp3' },
      { key: 'luohualiushui', label: '落花流水', file: './CDs/luohualiushui.mp3' },
      { key: 'jifenzhiji', label: '几分之几', file: './CDs/jifenzhiji.mp3' },
      { key: 'kezaiwoxindidemingzi', label: '刻在我心底的名字', file: './CDs/kezaiwoxindidemingzi.mp3' },
      { key: 'jiushiaini', label: '就是爱你', file: './CDs/jiushiaini.mp3' },
      { key: 'kgezhiwang', label: 'K歌之王', file: './CDs/kgezhiwang.mp3' },
      { key: 'jimodejijie', label: '寂寞的季节', file: './CDs/jimodejijie.mp3' },
      { key: 'aicuo', label: '爱错', file: './CDs/aicuo.mp3' },
      { key: 'geqian', label: '搁浅', file: './CDs/geqian.mp3' },
      { key: 'nibawoguanzui', label: '你把我灌醉', file: './CDs/nibawoguanzui.mp3' },
      { key: 'suiyueruge', label: '岁月如歌', file: './CDs/suiyueruge.mp3' },
      { key: 'yongbeijichangqingge', label: '用背脊唱情歌', file: './CDs/yongbeijichangqingge.mp3' },
      { key: 'yueding', label: '约定', file: './CDs/yueding.mp3' },
      { key: 'aiwohaishita', label: '爱我还是他', file: './CDs/aiwohaishita.mp3' },
      { key: 'daoshishuoaiwo', label: '到时说爱我', file: './CDs/daoshishuoaiwo.mp3' },
      { key: 'tebiederen', label: '特别的人', file: './CDs/tebiederen.mp3' },
      { key: 'huahai', label: '花海', file: './CDs/huahai.mp3' },
      { key: 'shihao', label: '嗜好', file: './CDs/shihao.mp3' },
      { key: 'yiluxiangbei', label: '一路向北', file: './CDs/yiluxiangbei.mp3' },
      { key: 'aihenjiandan', label: '爱很简单', file: './CDs/aihenjiandan.mp3' },
      { key: 'shimianmaifu', label: '十面埋伏', file: './CDs/shimianmaifu.mp3' }
    ];

    const listContainer = document.createElement('div');
    listContainer.style.display = 'grid';
    listContainer.style.gap = '12px';
    listContainer.style.marginTop = '14px';

    let previewAudio = null;
    let currentSelection = localStorage.getItem(STORAGE_KEY);
    const statusText = document.getElementById('statusText');

    function updateSelectionState() {
      document.querySelectorAll('.cd-card').forEach((row) => {
        const btn = row.querySelector('.select-btn');
        if (!btn) return;
        const isSelected = row.dataset.cdKey === currentSelection;
        btn.textContent = isSelected ? '已选择' : '选择';
        btn.disabled = isSelected;
      });
      if (statusText && currentSelection) {
        const selectedCd = cdList.find((cd) => cd.key === currentSelection);
        if (selectedCd) {
          statusText.textContent = `已选中 ${selectedCd.label}，请按右侧的【返回编辑】返回上页以放入包裹`;
        }
      }
    }

    function createCdRow(cd) {
      const row = document.createElement('div');
      row.className = 'cd-card';
      row.dataset.cdKey = cd.key;
      const img = document.createElement('img');
      img.src = './cd.png';
      img.alt = cd.label;

      const meta = document.createElement('div');
      meta.className = 'cd-meta';
      const h2 = document.createElement('h2');
      h2.textContent = cd.label;
      const p = document.createElement('p');
      p.textContent = '点击试听或确认选择这张 CD。';
      meta.appendChild(h2);
      meta.appendChild(p);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const playBtn = document.createElement('button');
      playBtn.className = 'btn';
      playBtn.textContent = '试听';
      const selectBtn = document.createElement('button');
      selectBtn.className = 'btn select-btn';
      selectBtn.textContent = currentSelection === cd.key ? '已选择' : '选择';
      selectBtn.disabled = currentSelection === cd.key;
      const backBtn = document.createElement('button');
      backBtn.className = 'btn button-secondary';
      backBtn.textContent = '返回编辑';
      actions.appendChild(playBtn);
      actions.appendChild(selectBtn);
      actions.appendChild(backBtn);

      // layout: img | meta (flex) | actions
      row.appendChild(img);
      row.appendChild(meta);
      row.appendChild(actions);

      playBtn.addEventListener('click', () => {
        if (previewAudio) {
          previewAudio.pause();
          previewAudio = null;
        }
        previewAudio = new Audio(cd.file);
        previewAudio.preload = 'auto';
        previewAudio.currentTime = 0;
        previewAudio.play().catch(() => {});
      });

      selectBtn.addEventListener('click', () => {
        localStorage.setItem(STORAGE_KEY, cd.key);
        currentSelection = cd.key;
        statusText.textContent = `已选中 ${cd.label}，请按右侧的【返回编辑】返回上页以放入包裹`;
        updateSelectionState();
      });

      backBtn.addEventListener('click', () => {
        window.location.href = './index.html';
      });

      return row;
    }

    cdList.forEach((cd) => listContainer.appendChild(createCdRow(cd)));
    const placeholder = document.getElementById('cdListPlaceholder');
    if (placeholder) {
      placeholder.appendChild(listContainer);
    } else {
      document.body.querySelector('.page').insertBefore(listContainer, document.body.querySelector('.actions'));
    }

    updateSelectionState();

    const cancelBtnEl = document.getElementById('cancelBtn');
    if (cancelBtnEl) cancelBtnEl.addEventListener('click', () => { window.location.href = './index.html'; });
  </script>
</body>
</html>
