<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择CD</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fff7f0 0%, #ffe6ef 45%, #f8f8ff 100%);
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .page {
      width: min(100%, 520px);
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.12);
      padding: 28px 24px;
      text-align: center;
    }
    .page h1 {
      margin: 0 0 14px;
      color: #d63f63;
      font-size: 26px;
    }
    .page p {
      color: #6b7280;
      line-height: 1.7;
      margin: 0 0 22px;
    }
    .cd-card {
      border: 1px solid #f2dbe5;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: #fff7fb;
    }
    .cd-card img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex: 0 0 56px;
      border-radius: 6px;
      background: white;
      padding: 6px;
    }
    .cd-meta {
      flex: 1 1 auto;
      min-width: 0;
    }
    .cd-meta h2 {
      margin: 0;
      font-size: 16px;
      color: #2f2f2f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cd-meta p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: #6b7280;
    }
    .cd-card .actions {
      margin-top: 0;
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
    }
    .cd-card .btn {
      padding: 6px 10px;
      font-size: 13px;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .button-secondary {
      background: #f8f5f8;
      color: #6b7280;
      border: 1px solid #e5dce2;
    }
    .status {
      color: #6b7280;
      font-size: 14px;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>选择CD</h1>
    <p>你可以放入最多一张CD，打开包裹时会自动播放这首歌。</p>
    <div id="cdListPlaceholder"></div>
    <div class="status" id="statusText">MP3将在此页面加载，避免主页面卡顿。</div>
    <!-- per-row 返回按钮 will be shown on each CD row; removed global return button -->
  </div>

  <script>
    const STORAGE_KEY = 'virtualGiftSelectedCD';
    const cdList = [
      { key: 'qingtian', label: '晴天', file: './CDs/qingtian.mp3' },
      { key: 'luohualiushui', label: '落花流水', file: './CDs/luohualiushui.mp3' },
      { key: 'jifenzhiji', label: '几分之几', file: './CDs/jifenzhiji.mp3' },
      { key: 'kezaiwoxindidemingzi', label: '刻在我心底的名字', file: './CDs/kezaiwoxindidemingzi.mp3' },
      { key: 'jiushiaini', label: '就是爱你', file: './CDs/jiushiaini.mp3' },
      { key: 'kgezhiwang', label: 'K歌之王', file: './CDs/kgezhiwang.mp3' },
      { key: 'jimodejijie', label: '寂寞的季节', file: './CDs/jimodejijie.mp3' },
      { key: 'aicuo', label: '爱错', file: './CDs/aicuo.mp3' }
    ];

    const listContainer = document.createElement('div');
    listContainer.style.display = 'grid';
    listContainer.style.gap = '12px';
    listContainer.style.marginTop = '14px';

    let previewAudio = null;
    let currentSelection = null;

    function createCdRow(cd) {
      const row = document.createElement('div');
      row.className = 'cd-card';
      const img = document.createElement('img');
      img.src = './cd.png';
      img.alt = cd.label;

      const meta = document.createElement('div');
      meta.className = 'cd-meta';
      const h2 = document.createElement('h2');
      h2.textContent = cd.label;
      const p = document.createElement('p');
      p.textContent = '点击试听或确认选择这张 CD。';
      meta.appendChild(h2);
      meta.appendChild(p);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const playBtn = document.createElement('button');
      playBtn.className = 'btn';
      playBtn.textContent = '试听';
      const selectBtn = document.createElement('button');
      selectBtn.className = 'btn';
      selectBtn.textContent = '选择';
      const backBtn = document.createElement('button');
      backBtn.className = 'btn button-secondary';
      backBtn.textContent = '返回编辑';
      actions.appendChild(playBtn);
      actions.appendChild(selectBtn);
      actions.appendChild(backBtn);

      // layout: img | meta (flex) | actions
      row.appendChild(img);
      row.appendChild(meta);
      row.appendChild(actions);

      playBtn.addEventListener('click', () => {
        if (previewAudio) {
          previewAudio.pause();
          previewAudio = null;
        }
        previewAudio = new Audio(cd.file);
        previewAudio.preload = 'auto';
        previewAudio.currentTime = 0;
        previewAudio.play().catch(() => {});
      });

      selectBtn.addEventListener('click', () => {
        localStorage.setItem(STORAGE_KEY, cd.key);
        currentSelection = cd.key;
        statusText.textContent = `已选中 ${cd.label}，请按右侧的【返回编辑】返回上页以放入包裹`;
      });

      backBtn.addEventListener('click', () => {
        window.location.href = './index.html';
      });

      return row;
    }

    cdList.forEach((cd) => listContainer.appendChild(createCdRow(cd)));
    const placeholder = document.getElementById('cdListPlaceholder');
    if (placeholder) {
      placeholder.appendChild(listContainer);
    } else {
      document.body.querySelector('.page').insertBefore(listContainer, document.body.querySelector('.actions'));
    }

    const cancelBtnEl = document.getElementById('cancelBtn');
    const statusText = document.getElementById('statusText');
    if (cancelBtnEl) cancelBtnEl.addEventListener('click', () => { window.location.href = './index.html'; });
  </script>
</body>
</html>
