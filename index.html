<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 神秘包裹</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="3D神秘包裹" />
  <meta property="og:image" content="https://zhangjingcong140-ux.github.io/virtual-gift/sharecover.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="header">
        <div>
          <h1>📦 3D 神秘包裹</h1>
          <p>填写收件人或选择小物件后，才能生成可分享的包裹。</p>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="box-stage">
            <!-- Large box fills the left area -->
            <div class="inside" id="insideWrap">
              <img id="innerBox" class="inner-box" src="./box.png" alt="包裹" />
              <div id="insideObjects" class="items-layer" aria-hidden="true"></div>
            </div>
          </div>
          <div class="box-controls" style="margin-top: 12px; text-align: center;">
            <button class="btn small" id="changeBoxStyleBtn" type="button">更改箱子样式</button>
          </div>
          <div id="placedList" class="placed-list"></div>
        </div>

        <div class="card">
          <div class="form-group">
            <button class="btn small" id="clearBtn" type="button">还原包裹</button>
          </div>
          <div class="form-group">
            <label for="sender">寄件人姓名</label>
            <input id="sender" placeholder="请输入寄件人姓名" />
          </div>
          <div class="form-group">
            <label for="recipient">收件人姓名</label>
            <input id="recipient" placeholder="请输入收件人姓名" />
          </div>
          <div class="form-group">
            <label for="message">备注（可选）</label>
            <textarea id="message" placeholder="填写备注，没有也可以"></textarea>
          </div>
          <div class="form-group">
            <label>贺卡</label>
            <div class="card-picker" id="cardPicker">
              <button class="card-select-button" id="openCardPicker" type="button">
                <img src="./card.png" alt="选择贺卡" />
                <span>选择贺卡</span>
              </button>
              <div class="card-preview" id="cardPreview">
                <img id="cardPreviewImg" src="./cards/card1.png" alt="贺卡预览" />
                <div class="card-preview-text" id="cardPreviewText">贺卡内容会显示在这里，最多20个字。</div>
              </div>
              <div class="card-style-row" id="cardStyleRow"></div>
              <textarea id="cardContent" maxlength="20" placeholder="写点寄语，不超过20字"></textarea>
              <div class="card-footer">
                <span id="cardCount">0/20</span>
                <button class="btn small" id="placeCardBtn" type="button" disabled>放入包裹</button>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>CD</label>
            <div class="cd-select-row">
              <button id="openCdPicker" class="btn small" type="button">选择 CD</button>
              <span id="cdStatus" class="cd-status">未选择 CD</span>
            </div>
            <div class="cd-tip">进入 CD 页面后才会加载音乐文件，避免主页面卡顿。</div>
          </div>
          <div class="form-group">
            <label>小物件</label>
            <div class="item-list" id="itemList"></div>
          </div>
          <p class="helper-text" id="helperText">请输入收件人，或至少选择一个小物件/贺卡。</p>

          <div class="result-card" id="resultCard">
            <div class="result-title">包裹预览</div>
            <div id="resultText">还没有准备好可分享的包裹。</div>
          </div>

          <div class="share-card">
            <div class="result-title">分享链接</div>
            <div class="share-row">
              <input id="shareUrl" readonly value="请先生成包裹后再显示链接" />
              <button class="btn small" id="copyBtn" type="button">复制</button>
            </div>
            <div style="margin-top:12px;text-align:center;">
                <button class="btn" id="buildBtn" disabled>生成包裹</button>
            </div>
            <div class="qr-wrap">
              <img id="qrCode" alt="礼物二维码" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      inside: [] // items placed inside the box with positions {key,x,y}
    };

    const cardTemplates = [
      { key: 'card1', label: '贺卡样式一', image: './cards/card1.png' },
      { key: 'card2', label: '贺卡样式二', image: './cards/card2.png' },
      { key: 'card3', label: '贺卡样式三', image: './cards/card3.png' },
      { key: 'card4', label: '贺卡样式四', image: './cards/card4.png' },
      { key: 'card5', label: '贺卡样式五', image: './cards/card5.png' },
      { key: 'card6', label: '贺卡样式六', image: './cards/card6.png' },
      { key: 'card7', label: '贺卡样式七', image: './cards/card7.png' }
    ];

    const itemDefinitions = [
      { key: 'rose', label: '玫瑰', image: './rose.png' },
      { key: 'bug', label: '虫子', image: './bug.png' },
      { key: 'shit', label: '大便', image: './shit.png' },
      { key: 'firefly', label: '萤火虫', image: './firefly.png' },
      { key: 'confetti', label: '礼炮', image: './saluting_gun.png' },
      { key: 'cake', label: '蛋糕', image: './cake.png' }
    ];

    const hiddenItemDefinitions = [
      { key: 'orangecat', label: '橘猫', image: './more/cats/orangecat.png' },
      { key: 'graycat', label: '灰猫', image: './more/cats/graycat.png' },
      { key: 'whitecat', label: '白猫', image: './more/cats/whitecat.png' },
      { key: 'cowcat', label: '奶牛猫', image: './more/cats/cowcat.png' },
      { key: 'yellowdog', label: '黄色小狗', image: './more/cats/dogs/yellowdog.png' },
      { key: 'graydog', label: '灰色小狗', image: './more/cats/dogs/graydog.png' },
      { key: 'charliedog', label: '查理狗', image: './more/cats/dogs/charliedog.png' },
      { key: 'balloon', label: '气球', image: './more/balloon.png' },
      { key: 'bomb', label: '炸弹', image: './more/bomb.png' },
      { key: 'fu', label: '福字', image: './more/fu.png' },
      { key: 'violet', label: '紫罗兰', image: './more/violet.png' }
    ];

    const cdOptions = [
      { key: 'qingtian', label: '晴天', image: './cd.png', audio: './CDs/qingtian.mp3' },
      { key: 'luohualiushui', label: '落花流水', image: './cd.png', audio: './CDs/luohualiushui.mp3' },
      { key: 'jifenzhiji', label: '几分之几', image: './cd.png', audio: './CDs/jifenzhiji.mp3' },
      { key: 'kezaiwoxindidemingzi', label: '刻在我心底的名字', image: './cd.png', audio: './CDs/kezaiwoxindidemingzi.mp3' },
      { key: 'jiushiaini', label: '就是爱你', image: './cd.png', audio: './CDs/jiushiaini.mp3' },
      { key: 'kgezhiwang', label: 'K歌之王', image: './cd.png', audio: './CDs/kgezhiwang.mp3' },
      { key: 'jimodejijie', label: '寂寞的季节', image: './cd.png', audio: './CDs/jimodejijie.mp3' },
      { key: 'aicuo', label: '爱错', image: './cd.png', audio: './CDs/aicuo.mp3' },
      { key: 'geqian', label: '搁浅', image: './cd.png', audio: './CDs/geqian.mp3' },
      { key: 'nibawoguanzui', label: '你把我灌醉', image: './cd.png', audio: './CDs/nibawoguanzui.mp3' },
      { key: 'suiyueruge', label: '岁月如歌', image: './cd.png', audio: './CDs/suiyueruge.mp3' },
      { key: 'yongbeijichangqingge', label: '用背脊唱情歌', image: './cd.png', audio: './CDs/yongbeijichangqingge.mp3' },
      { key: 'yueding', label: '约定', image: './cd.png', audio: './CDs/yueding.mp3' },
      { key: 'aiwohaishita', label: '爱我还是他', image: './cd.png', audio: './CDs/aiwohaishita.mp3' },
      { key: 'daoshishuoaiwo', label: '到时说爱我', image: './cd.png', audio: './CDs/daoshishuoaiwo.mp3' },
      { key: 'tebiederen', label: '特别的人', image: './cd.png', audio: './CDs/tebiederen.mp3' },
      { key: 'aihenjiandan', label: '爱很简单', image: './cd.png', audio: './CDs/aihenjiandan.mp3' },
      { key: 'shimianmaifu', label: '十面埋伏', image: './cd.png', audio: './CDs/shimianmaifu.mp3' }
    ];
    const boxStyles = {
      classic: {
        closed: './box.png',
        open: './box_open.png',
        pet: './petbox.png'
      },
      leather: {
        closed: './leatherbox.png',
        open: './leatherbox_open.png',
        pet: './petleatherbox.png'
      },
      mc: {
        closed: './mcbox.png',
        open: './mcbox_open.png',
        pet: './petmcbox.png'
      }
    };
    const cdMap = Object.fromEntries(cdOptions.map((cd) => [cd.key, cd]));
    const itemMap = Object.fromEntries(
      [...itemDefinitions, ...hiddenItemDefinitions].map((item) => [item.key, item])
    );
    const cardMap = Object.fromEntries(cardTemplates.map((card) => [card.key, card]));

    const insideObjects = document.getElementById('insideObjects');
    const insideWrap = document.getElementById('insideWrap');
    const resultText = document.getElementById('resultText');
    const innerBox = document.getElementById('innerBox');
    const placedList = document.getElementById('placedList');
    const senderInput = document.getElementById('sender');
    const recipientInput = document.getElementById('recipient');
    const messageInput = document.getElementById('message');
    const itemList = document.getElementById('itemList');
    const shareUrlInput = document.getElementById('shareUrl');
    const qrCodeImg = document.getElementById('qrCode');
    const buildBtn = document.getElementById('buildBtn');
    const helperText = document.getElementById('helperText');
    const cardPicker = document.getElementById('cardPicker');
    const openCardPicker = document.getElementById('openCardPicker');
    const cardStyleRow = document.getElementById('cardStyleRow');
    const cardPreviewImg = document.getElementById('cardPreviewImg');
    const cardPreviewText = document.getElementById('cardPreviewText');
    const cardContentInput = document.getElementById('cardContent');
    const cardCount = document.getElementById('cardCount');
    const placeCardBtn = document.getElementById('placeCardBtn');
    const openCdPickerBtn = document.getElementById('openCdPicker');
    const cdStatus = document.getElementById('cdStatus');
    const placeCdBtn = document.createElement('button');
    placeCdBtn.id = 'placeCdBtn';
    placeCdBtn.className = 'btn small';
    placeCdBtn.type = 'button';
    placeCdBtn.textContent = '放入包裹';
    let hasGenerated = false;
    let selectedCard = cardTemplates[0].key;
    let cardContent = '';
    let placedCard = null;
    let selectedCD = null;
    let placedCD = null;
    let selectedBoxStyle = 'classic';

    function saveSelectedCDToStorage() {
      if (selectedCD) {
        localStorage.setItem('virtualGiftSelectedCD', selectedCD);
      } else {
        localStorage.removeItem('virtualGiftSelectedCD');
      }
    }

    function saveSelectedBoxStyleToStorage() {
      if (selectedBoxStyle) {
        localStorage.setItem('virtualGiftSelectedBoxStyle', selectedBoxStyle);
      } else {
        localStorage.removeItem('virtualGiftSelectedBoxStyle');
      }
    }

    function saveDraftToStorage() {
      const draft = {
        sender: senderInput.value,
        recipient: recipientInput.value,
        message: messageInput.value,
        inside: state.inside,
        placedCard,
        selectedCD,
        placedCD,
        selectedCard,
        cardContent: cardContentInput.value,
        boxStyle: selectedBoxStyle
      };
      localStorage.setItem('virtualGiftDraft', JSON.stringify(draft));
    }

    function restorePackage() {
      state.inside = [];
      placedCard = null;
      placedCD = null;
      selectedCD = null;
      selectedCard = cardTemplates[0].key;
      senderInput.value = '';
      recipientInput.value = '';
      messageInput.value = '';
      cardContentInput.value = '';
      selectedBoxStyle = 'classic';
      hasGenerated = false;
      saveSelectedCDToStorage();
      saveSelectedBoxStyleToStorage();
      saveDraftToStorage();
      renderObjects();
      renderPlacedList();
      updateCardState();
      syncBoxImages();
      if (shareUrlInput) {
        shareUrlInput.value = '请先生成包裹后再显示链接';
      }
      if (qrCodeImg) qrCodeImg.removeAttribute('src');
    }

    function loadDraftFromStorage() {
      let draft = {};
      const raw = localStorage.getItem('virtualGiftDraft');
      if (raw) {
        try {
          draft = JSON.parse(raw) || {};
          if (draft.sender) senderInput.value = draft.sender;
          if (draft.recipient) recipientInput.value = draft.recipient;
          if (draft.message) messageInput.value = draft.message;
          if (Array.isArray(draft.inside)) state.inside = draft.inside;
          if (draft.placedCard) placedCard = draft.placedCard;
          if (draft.selectedCD && cdMap[draft.selectedCD]) selectedCD = draft.selectedCD;
          if (draft.placedCD && cdMap[draft.placedCD]) placedCD = draft.placedCD;
          if (draft.selectedCard && cardMap[draft.selectedCard]) selectedCard = draft.selectedCard;
          if (typeof draft.cardContent === 'string') cardContentInput.value = draft.cardContent;
          if (draft.boxStyle && boxStyles[draft.boxStyle]) selectedBoxStyle = draft.boxStyle;
        } catch (error) {
          console.warn('无法读取草稿', error);
        }
      }
      const extraRaw = localStorage.getItem('virtualGiftMoreItems');
      if (extraRaw) {
        try {
          const extraItems = JSON.parse(extraRaw);
          if (Array.isArray(extraItems)) {
            extraItems.forEach((key) => {
              if (itemMap[key]) state.inside.push({ key, x: 10, y: 10 });
            });
          }
        } catch (error) {
          console.warn('无法读取更多小物件', error);
        }
        localStorage.removeItem('virtualGiftMoreItems');
      }
      const saved = localStorage.getItem('virtualGiftSelectedCD');
      if (saved && cdMap[saved]) selectedCD = saved;
      const savedStyle = localStorage.getItem('virtualGiftSelectedBoxStyle');
      if (savedStyle && boxStyles[savedStyle]) selectedBoxStyle = savedStyle;
    }

    function updateGenerateState() {
      const hasSender = senderInput.value.trim().length > 0;
      const hasSelection = state.inside.length > 0 || !!placedCard || !!placedCD;
      const canGenerate = hasSender || hasSelection;
      buildBtn.disabled = !canGenerate;
      helperText.textContent = canGenerate
        ? '填写收件人或选择至少一个小物件后，就可以生成包裹。'
        : '请输入寄件人，或至少选择一个小物件。';
      if (!hasGenerated) {
        shareUrlInput.value = '请先生成包裹后再显示链接';
        qrCodeImg.removeAttribute('src');
      }
    }

    function renderCardPicker() {
      if (!cardStyleRow) return;
      if (!selectedCard) selectedCard = cardTemplates[0].key;
      cardPreviewImg.src = cardMap[selectedCard].image;
      cardStyleRow.innerHTML = cardTemplates.map((card) => `
        <button class="card-style ${selectedCard === card.key ? 'active' : ''}" data-card="${card.key}" type="button">
          <img src="${card.image}" alt="贺卡样式" />
        </button>
      `).join('');

      Array.from(cardStyleRow.querySelectorAll('.card-style')).forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedCard = btn.dataset.card;
          cardPreviewImg.src = cardMap[selectedCard].image;
          renderCardPicker();
          updateCardState();
        });
      });
    }

    function updateCardState() {
    cardContent = cardContentInput.value.trim().slice(0, 20);
    cardCount.textContent = `${cardContent.length}/20`;
    cardPreviewText.textContent = cardContent || '贺卡内容会显示在这里，最多20个字。';
    placeCardBtn.disabled = !selectedCard || cardContent.length === 0 || !!placedCard;
    if (placedCard) {
      placeCardBtn.textContent = '已放入包裹';
    } else {
      placeCardBtn.textContent = '放入包裹';
    }
  }

  function getItemCounts(items) {
    return items.reduce((counts, key) => {
      counts[key] = (counts[key] || 0) + 1;
      return counts;
    }, {});
  }

  function formatItemSummary(items) {
    const counts = getItemCounts(items);
    return Object.entries(counts).map(([key, count]) => {
      const label = itemMap[key]?.label || key;
      return count > 1 ? `${label}×${count}` : label;
    }).join('、');
  }

  function renderItemButtons() {
      const buttonsHtml = itemDefinitions.map((item) => `
        <button class="item-btn" data-item="${item.key}" type="button" draggable="true">
          <span class="item-icon"><img src="${item.image}" alt="${item.label}" /></span>
          <span>${item.label}</span>
        </button>
      `).join('');
      const moreButton = `
        <button class="item-btn more-btn" data-more="true" type="button">
          <span class="item-icon"><img src="./more.png" alt="更多" /></span>
          <span>更多</span>
        </button>
      `;
      itemList.innerHTML = buttonsHtml + moreButton;

      Array.from(itemList.querySelectorAll('.item-btn')).forEach((btn) => {
        if (btn.dataset.more === 'true') {
          btn.addEventListener('click', () => {
            saveDraftToStorage();
            window.location.href = './more.html';
          });
          return;
        }

        btn.addEventListener('click', () => {
          const item = btn.dataset.item;
          if (!itemMap[item]) return;
          state.inside.push({ key: item, x: 10, y: 10 });
          saveDraftToStorage();
          boxOpen = true;
          syncBoxImages();
          renderObjects();
          renderPlacedList();
          if (hasGenerated) void createShareLink();
        });

        btn.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', btn.dataset.item);
          e.dataTransfer.effectAllowed = 'copy';
        });
      });
    }

    function renderObjects() {
      // Do not render placed items visually on the box; only show them in the list below.
      insideObjects.innerHTML = '';

      const sender = senderInput.value.trim();
      const recipient = recipientInput.value.trim();
      const message = messageInput.value.trim();
      const itemText = formatItemSummary(state.inside.map((i) => i.key));
      const cardText = placedCard ? `；已放入贺卡：${cardMap[placedCard.cardKey].label}` : '';
      const cdText = placedCD ? `；已放入CD：${cdMap[placedCD].label}` : '';
      resultText.innerHTML = `寄件人：${sender || '尚未填写'}<br/>收件人：${recipient || '尚未填写'}<br/>备注：${message || '可选'}<br/>包裹内容：${itemText || '还没有放入任何小物件'}${cardText}${cdText}`;
      cdStatus.textContent = selectedCD ? `已选择 CD：${cdMap[selectedCD].label}` : '未选择 CD';
      // place button label reflect state
      if (selectedCD) {
        placeCdBtn.disabled = false;
        placeCdBtn.textContent = placedCD ? '已放入包裹（移除）' : '放入包裹';
      } else {
        placeCdBtn.disabled = true;
        placeCdBtn.textContent = '放入包裹';
      }
      updateGenerateState();
    }

    function renderPlacedList() {
      if (!placedList) return;
      const counts = getItemCounts(state.inside.map((it) => it.key));
      const rows = Object.entries(counts).map(([key, count]) => {
        const item = itemMap[key];
        return `
        <div class="placed-row" data-key="${key}">
          <img src="${item.image}" alt="${item.label}" />
          <div class="label">${item.label}${count > 1 ? `×${count}` : ''}</div>
          <button data-key="${key}" class="remove-btn">删除</button>
        </div>
      `;
      }).join('');
      const cardRow = placedCard ? `
        <div class="placed-row placed-card-row">
          <img src="${cardMap[placedCard.cardKey].image}" alt="贺卡" />
          <div class="label">贺卡：${cardMap[placedCard.cardKey].label}</div>
          <button data-card="remove" class="remove-btn">删除</button>
        </div>
      ` : '';
      const cdRow = placedCD ? `
        <div class="placed-row placed-card-row">
          <img src="${cdMap[placedCD].image}" alt="CD" />
          <div class="label">CD：${cdMap[placedCD].label}</div>
          <button data-cd="remove" class="remove-btn">删除</button>
        </div>
      ` : '';
      placedList.innerHTML = rows + cardRow + cdRow;

      Array.from(placedList.querySelectorAll('.remove-btn')).forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.dataset.card === 'remove') {
            placedCard = null;
            saveDraftToStorage();
          } else if (btn.dataset.cd === 'remove') {
            // remove placed CD
            placedCD = null;
            saveDraftToStorage();
          } else {
            const key = btn.dataset.key;
            const idx = state.inside.findIndex((item) => item.key === key);
            if (idx === -1) return;
            state.inside.splice(idx, 1);
            saveDraftToStorage();
          }
          renderObjects();
          renderPlacedList();
          if (hasGenerated) void createShareLink();
          updateCardState();
        });
      });
    }

    function serializeGiftPayload() {
      const sender = senderInput.value.trim();
      const recipient = recipientInput.value.trim();
      const message = messageInput.value.trim();
      const items = state.inside.map((i) => i.key);
      const payload = {
        sender: sender || '',
        recipient: recipient || '',
        message: message || '',
        items,
        card: placedCard ? placedCard.cardKey : null,
        cardText: placedCard ? placedCard.content : '',
        cd: placedCD || null,
        boxStyle: selectedBoxStyle || 'classic'
      };
      return LZString.compressToEncodedURIComponent(JSON.stringify(payload));
    }

    async function createShareLink() {
      if (!hasGenerated) {
        shareUrlInput.value = '请先生成包裹后再显示链接';
        qrCodeImg.removeAttribute('src');
        return;
      }

      const compressedData = await Promise.resolve(serializeGiftPayload());
      const url = new URL('receive.html', window.location.href);
      url.searchParams.set('d', compressedData);

      const finalUrl = url.toString();
      shareUrlInput.value = finalUrl;
      qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(finalUrl)}`;
      qrCodeImg.alt = '礼物二维码';
    }


    [senderInput, recipientInput, messageInput].forEach((input) => {
      input.addEventListener('input', () => {
        renderObjects();
        if (hasGenerated) void createShareLink();
      });
    });

    cardContentInput.addEventListener('input', () => {
      if (cardContentInput.value.length > 20) {
        cardContentInput.value = cardContentInput.value.slice(0, 20);
      }
      updateCardState();
    });

    placeCardBtn.addEventListener('click', () => {
      if (!selectedCard || !cardContent || placedCard) return;
      placedCard = { cardKey: selectedCard, content: cardContent };
      selectedCard = null;
      cardContentInput.value = '';
      renderCardPicker();
      updateCardState();
      renderObjects();
      renderPlacedList();
      if (hasGenerated) void createShareLink();
    });

    if (openCardPicker) {
      openCardPicker.addEventListener('click', () => {
        cardPicker.classList.toggle('active');
        if (cardPicker.classList.contains('active')) {
          renderCardPicker();
          updateCardState();
        }
      });
    }
    const openBoxStyleBtn = document.getElementById('changeBoxStyleBtn');
    if (openBoxStyleBtn) {
      openBoxStyleBtn.addEventListener('click', () => {
        saveDraftToStorage();
        window.location.href = './box.html';
      });
    }
    if (openCdPickerBtn) {
      openCdPickerBtn.addEventListener('click', () => {
        saveDraftToStorage();
        window.location.href = './cd.html';
      });
    }
    // insert placeCdBtn next to cd status
    if (cdStatus && placeCdBtn) {
      cdStatus.parentNode.insertBefore(placeCdBtn, cdStatus.nextSibling);
    }
    placeCdBtn.addEventListener('click', () => {
      if (!selectedCD) {
        // no selection yet, go to picker
        saveDraftToStorage();
        window.location.href = './cd.html';
        return;
      }
      if (placedCD && placedCD === selectedCD) {
        // remove
        placedCD = null;
      } else {
        // place selected into package
        placedCD = selectedCD;
      }
      saveDraftToStorage();
      renderObjects();
      renderPlacedList();
      if (hasGenerated) void createShareLink();
    });

    document.getElementById('buildBtn').addEventListener('click', () => {
      const sender = senderInput.value.trim();
      const hasSender = sender.length > 0;
      const hasSelection = state.inside.length > 0 || !!placedCard || !!selectedCD;
      if (!hasSender && !hasSelection) return;
      hasGenerated = true;
      if (innerBox) {
        innerBox.classList.add('open');
        setTimeout(() => innerBox.classList.remove('open'), 500);
      }
      renderObjects();
      void createShareLink();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareUrlInput.value);
        document.getElementById('copyBtn').textContent = '已复制';
        setTimeout(() => {
          document.getElementById('copyBtn').textContent = '复制';
        }, 1200);
      } catch (error) {
        console.error(error);
      }
    });

    const restoreBtn = document.getElementById('clearBtn');
    if (restoreBtn) {
      restoreBtn.addEventListener('click', () => {
        if (!confirm('是否要还原包裹')) return;
        restorePackage();
      });
    }

    // toggle single inner box open/close by swapping image
    let boxOpen = false;
    function syncBoxImages() {
      const style = boxStyles[selectedBoxStyle] || boxStyles.classic;
      if (innerBox) innerBox.src = boxOpen ? style.open : style.closed;
      if (innerBox) innerBox.classList.toggle('open', boxOpen);
    }

    if (innerBox) {
      innerBox.addEventListener('click', (e) => {
        // respond immediately on single click
        e.stopPropagation();
        boxOpen = !boxOpen;
        syncBoxImages();
      });
    }

    // drag & drop into inside area
    insideWrap.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    insideWrap.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!boxOpen) return; // only accept drops when box open
      const key = e.dataTransfer.getData('text/plain');
      if (!key || key === 'cd') return;
      const rect = insideWrap.getBoundingClientRect();
      const itemW = 44;
      const x = Math.round(e.clientX - rect.left - itemW / 2);
      const y = Math.round(e.clientY - rect.top - itemW / 2);
      state.inside.push({ key, x: Math.max(0, x), y: Math.max(0, y) });
      renderObjects();
      renderPlacedList();
      void createShareLink();
    });
    loadDraftFromStorage();
    renderCardPicker();
    updateCardState();
    renderItemButtons();
    renderObjects();
    renderPlacedList();
    // ensure box image matches selected style immediately
    syncBoxImages();
    void createShareLink();
  </script>
</body>
</html>
