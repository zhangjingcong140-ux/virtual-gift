<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 神秘包裹</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="header">
        <div>
          <h1>📦 3D 神秘包裹</h1>
          <p>填写收件人或选择小物件后，才能生成可分享的包裹。</p>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="box-stage">
            <!-- Only keep the inner box as the single interactive package -->
            <div class="inside" id="insideWrap">
              <div id="insideObjects" class="items-layer"></div>
              <img id="innerBox" class="inner-box" src="./box.png" alt="包裹" />
            </div>
            <div class="box-controls" style="text-align:center;margin-top:12px;">
              <button class="btn" id="buildBtn" disabled>生成包裹</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="form-group">
            <label for="recipient">收件人姓名</label>
            <input id="recipient" placeholder="请输入收件人姓名" />
          </div>
          <div class="form-group">
            <label for="message">备注（可选）</label>
            <textarea id="message" placeholder="填写备注，没有也可以"></textarea>
          </div>
          <div class="form-group">
            <label>小物件</label>
            <div class="item-list" id="itemList"></div>
          </div>
          <p class="helper-text" id="helperText">请输入收件人，或至少选择一个小物件。</p>

          <div class="result-card" id="resultCard">
            <div class="result-title">包裹预览</div>
            <div id="resultText">还没有准备好可分享的包裹。</div>
          </div>

          <div class="share-card">
            <div class="result-title">分享链接</div>
            <div class="share-row">
              <input id="shareUrl" readonly value="填写后才会生成分享链接" />
              <button class="btn small" id="copyBtn" type="button">复制</button>
            </div>
            <div class="qr-wrap">
              <img id="qrCode" alt="礼物二维码" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      selected: [], // items selected in the sidebar
      inside: [] // items placed inside the box with positions {key,x,y}
    };

    const itemDefinitions = [
      { key: 'rose', label: '玫瑰', image: './rose.png' },
      { key: 'bug', label: '虫子', image: './bug.png' },
      { key: 'shit', label: '大便', image: './shit.png' },
      { key: 'card', label: '贺卡', image: './card.png' },
      { key: 'firefly', label: '萤火虫', image: './firefly.png' }
    ];

    const itemMap = Object.fromEntries(itemDefinitions.map((item) => [item.key, item]));

    const insideObjects = document.getElementById('insideObjects');
    const insideWrap = document.getElementById('insideWrap');
    const resultText = document.getElementById('resultText');
    const innerBox = document.getElementById('innerBox');
    const recipientInput = document.getElementById('recipient');
    const messageInput = document.getElementById('message');
    const itemList = document.getElementById('itemList');
    const shareUrlInput = document.getElementById('shareUrl');
    const qrCodeImg = document.getElementById('qrCode');
    const buildBtn = document.getElementById('buildBtn');
    const helperText = document.getElementById('helperText');

    function updateGenerateState() {
      const hasRecipient = recipientInput.value.trim().length > 0;
      const hasSelection = state.selected.length > 0 || state.inside.length > 0;
      const canGenerate = hasRecipient || hasSelection;
      buildBtn.disabled = !canGenerate;
      helperText.textContent = canGenerate
        ? '备注是可选的，收件人或包裹内物件至少填一项。'
        : '请输入收件人，或至少放入一个小物件。';
    }

    function renderItemButtons() {
      itemList.innerHTML = itemDefinitions.map((item) => `
        <button class="item-btn ${state.selected.includes(item.key) ? 'active' : ''}" data-item="${item.key}" type="button" draggable="true">
          <span class="item-icon"><img src="${item.image}" alt="${item.label}" /></span>
          <span>${item.label}</span>
        </button>
      `).join('');

      Array.from(itemList.querySelectorAll('.item-btn')).forEach((btn) => {
        btn.addEventListener('click', () => {
          const item = btn.dataset.item;
          if (state.selected.includes(item)) {
            state.selected = state.selected.filter((x) => x !== item);
          } else {
            state.selected.push(item);
          }
          renderItemButtons();
          renderObjects();
        });

        btn.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', btn.dataset.item);
          e.dataTransfer.effectAllowed = 'copy';
        });
      });
    }

    function renderObjects() {
      insideObjects.innerHTML = state.inside.map((it, idx) => `
        <div class="object-item" data-idx="${idx}" style="left:${it.x}px;top:${it.y}px;">
          <img src="${itemMap[it.key].image}" alt="${itemMap[it.key].label}" />
        </div>
      `).join('');

      const recipient = recipientInput.value.trim();
      const message = messageInput.value.trim();
      const itemText = (state.inside.length ? state.inside.map(i => itemMap[i.key].label) : state.selected.map(i => itemMap[i].label)).join('、') || '还没有放入任何小物件';
      resultText.innerHTML = `收件人：${recipient || '尚未填写'}<br/>备注：${message || '可选'}<br/>包裹内物件：${itemText}`;
      updateGenerateState();
    }

    function createShareLink() {
      const recipient = recipientInput.value.trim();
      const message = messageInput.value.trim();
      const items = state.inside.length ? state.inside.map(i => i.key) : state.selected;
      const hasRecipient = recipient.length > 0;
      const hasSelection = items.length > 0;
      if (!hasRecipient && !hasSelection) {
        shareUrlInput.value = '填写后才会生成分享链接';
        qrCodeImg.removeAttribute('src');
        return;
      }

      const url = new URL('gift.html', window.location.href);
      if (recipient) url.searchParams.set('r', recipient);
      if (message) url.searchParams.set('m', message);
      if (items.length) url.searchParams.set('i', items.join(','));

      shareUrlInput.value = url.toString();
      qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url.toString())}`;
      qrCodeImg.alt = '礼物二维码';
    }


    [recipientInput, messageInput].forEach((input) => {
      input.addEventListener('input', () => {
        renderObjects();
        createShareLink();
      });
    });

    document.getElementById('buildBtn').addEventListener('click', () => {
      const recipient = recipientInput.value.trim();
      const hasRecipient = recipient.length > 0;
      const hasSelection = state.selected.length > 0 || state.inside.length > 0;
      if (!hasRecipient && !hasSelection) return;
      if (innerBox) {
        innerBox.classList.add('open');
        setTimeout(() => innerBox.classList.remove('open'), 500);
      }
      renderObjects();
      createShareLink();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareUrlInput.value);
        document.getElementById('copyBtn').textContent = '已复制';
        setTimeout(() => {
          document.getElementById('copyBtn').textContent = '复制';
        }, 1200);
      } catch (error) {
        console.error(error);
      }
    });

    // toggle single inner box open/close by swapping image
    let boxOpen = false;
    function syncBoxImages() {
      if (innerBox) innerBox.src = boxOpen ? './box_open.png' : './box.png';
      if (innerBox) innerBox.classList.toggle('open', boxOpen);
    }

    if (innerBox) {
      innerBox.addEventListener('click', () => {
        boxOpen = !boxOpen;
        syncBoxImages();
      });
    }

    // drag & drop into inside area
    insideWrap.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    insideWrap.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!boxOpen) return; // only accept drops when box open
      const key = e.dataTransfer.getData('text/plain');
      if (!key) return;
      const rect = insideObjects.getBoundingClientRect();
      const x = e.clientX - rect.left - 32; // center offset
      const y = e.clientY - rect.top - 32;
      state.inside.push({ key, x: Math.max(8, x), y: Math.max(8, y) });
      renderObjects();
      createShareLink();
    });
    renderItemButtons();
    renderObjects();
    createShareLink();
  </script>
</body>
</html>
