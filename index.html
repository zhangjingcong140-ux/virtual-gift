<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 神秘包裹</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="header">
        <div>
          <h1>📦 3D 神秘包裹</h1>
          <p>填写收件人或选择小物件后，才能生成可分享的包裹。</p>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="box-stage">
            <!-- Large box fills the left area -->
            <div class="inside" id="insideWrap">
              <img id="innerBox" class="inner-box" src="./box.png" alt="包裹" />
              <div id="insideObjects" class="items-layer" aria-hidden="true"></div>
            </div>
          </div>
          <div id="placedList" class="placed-list"></div>
        </div>

        <div class="card">
          <div class="form-group">
            <label for="sender">寄件人姓名</label>
            <input id="sender" placeholder="请输入寄件人姓名" />
          </div>
          <div class="form-group">
            <label for="recipient">收件人姓名</label>
            <input id="recipient" placeholder="请输入收件人姓名" />
          </div>
          <div class="form-group">
            <label for="message">备注（可选）</label>
            <textarea id="message" placeholder="填写备注，没有也可以"></textarea>
          </div>
          <div class="form-group">
            <label>贺卡</label>
            <div class="card-picker" id="cardPicker">
              <button class="card-select-button" id="openCardPicker" type="button">
                <img src="./card.png" alt="选择贺卡" />
                <span>选择贺卡</span>
              </button>
              <div class="card-preview" id="cardPreview">
                <img id="cardPreviewImg" src="./cards/card1.png" alt="贺卡预览" />
                <div class="card-preview-text" id="cardPreviewText">贺卡内容会显示在这里，最多20个字。</div>
              </div>
              <div class="card-style-row" id="cardStyleRow"></div>
              <textarea id="cardContent" maxlength="20" placeholder="写点寄语，不超过20字"></textarea>
              <div class="card-footer">
                <span id="cardCount">0/20</span>
                <button class="btn small" id="placeCardBtn" type="button" disabled>放入包裹</button>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>小物件</label>
            <div class="item-list" id="itemList"></div>
          </div>
          <p class="helper-text" id="helperText">请输入收件人，或至少选择一个小物件/贺卡。</p>

          <div class="result-card" id="resultCard">
            <div class="result-title">包裹预览</div>
            <div id="resultText">还没有准备好可分享的包裹。</div>
          </div>

          <div class="share-card">
            <div class="result-title">分享链接</div>
            <div class="share-row">
              <input id="shareUrl" readonly value="请先生成包裹后再显示链接" />
              <button class="btn small" id="copyBtn" type="button">复制</button>
            </div>
            <div style="margin-top:12px;text-align:center;">
              <button class="btn" id="buildBtn" disabled>生成包裹</button>
            </div>
            <div class="qr-wrap">
              <img id="qrCode" alt="礼物二维码" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      selected: [], // items selected in the sidebar
      inside: [] // items placed inside the box with positions {key,x,y}
    };

    const cardTemplates = [
      { key: 'card1', label: '贺卡样式一', image: './cards/card1.png' },
      { key: 'card2', label: '贺卡样式二', image: './cards/card2.png' },
      { key: 'card3', label: '贺卡样式三', image: './cards/card3.png' },
      { key: 'card4', label: '贺卡样式四', image: './cards/card4.png' },
      { key: 'card5', label: '贺卡样式五', image: './cards/card5.png' },
      { key: 'card6', label: '贺卡样式六', image: './cards/card6.png' },
      { key: 'card7', label: '贺卡样式七', image: './cards/card7.png' }
    ];

    const itemDefinitions = [
      { key: 'rose', label: '玫瑰', image: './rose.png' },
      { key: 'bug', label: '虫子', image: './bug.png' },
      { key: 'shit', label: '大便', image: './shit.png' },
      { key: 'firefly', label: '萤火虫', image: './firefly.png' }
    ];

    const itemMap = Object.fromEntries(itemDefinitions.map((item) => [item.key, item]));
    const cardMap = Object.fromEntries(cardTemplates.map((card) => [card.key, card]));

    const insideObjects = document.getElementById('insideObjects');
    const insideWrap = document.getElementById('insideWrap');
    const resultText = document.getElementById('resultText');
    const innerBox = document.getElementById('innerBox');
    const placedList = document.getElementById('placedList');
    const senderInput = document.getElementById('sender');
    const recipientInput = document.getElementById('recipient');
    const messageInput = document.getElementById('message');
    const itemList = document.getElementById('itemList');
    const shareUrlInput = document.getElementById('shareUrl');
    const qrCodeImg = document.getElementById('qrCode');
    const buildBtn = document.getElementById('buildBtn');
    const helperText = document.getElementById('helperText');
    const cardPicker = document.getElementById('cardPicker');
    const openCardPicker = document.getElementById('openCardPicker');
    const cardStyleRow = document.getElementById('cardStyleRow');
    const cardPreviewImg = document.getElementById('cardPreviewImg');
    const cardPreviewText = document.getElementById('cardPreviewText');
    const cardContentInput = document.getElementById('cardContent');
    const cardCount = document.getElementById('cardCount');
    const placeCardBtn = document.getElementById('placeCardBtn');
  let hasGenerated = false;
  let selectedCard = cardTemplates[0].key;
  let cardContent = '';
  let placedCard = null;

  function updateGenerateState() {
    const hasSender = senderInput.value.trim().length > 0;
    const hasSelection = state.selected.length > 0 || state.inside.length > 0 || !!placedCard;
    const canGenerate = hasSender || hasSelection;
    buildBtn.disabled = !canGenerate;
    helperText.textContent = canGenerate
      ? '填写收件人或选择至少一个小物件后，就可以生成包裹。'
      : '请输入寄件人，或至少选择一个小物件。';
    if (!hasGenerated) {
      shareUrlInput.value = '请先生成包裹后再显示链接';
      qrCodeImg.removeAttribute('src');
    }
  }

  function renderCardPicker() {
    if (!cardStyleRow) return;
    if (!selectedCard) selectedCard = cardTemplates[0].key;
    cardPreviewImg.src = cardMap[selectedCard].image;
    cardStyleRow.innerHTML = cardTemplates.map((card) => `
      <button class="card-style ${selectedCard === card.key ? 'active' : ''}" data-card="${card.key}" type="button">
        <img src="${card.image}" alt="贺卡样式" />
      </button>
    `).join('');

    Array.from(cardStyleRow.querySelectorAll('.card-style')).forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedCard = btn.dataset.card;
        cardPreviewImg.src = cardMap[selectedCard].image;
        renderCardPicker();
        updateCardState();
      });
    });
  }

  function updateCardState() {
    cardContent = cardContentInput.value.trim().slice(0, 20);
    cardCount.textContent = `${cardContent.length}/20`;
    cardPreviewText.textContent = cardContent || '贺卡内容会显示在这里，最多20个字。';
    placeCardBtn.disabled = !selectedCard || cardContent.length === 0 || !!placedCard;
    if (placedCard) {
      placeCardBtn.textContent = '已放入包裹';
    } else {
      placeCardBtn.textContent = '放入包裹';
    }
  }

  function renderItemButtons() {
      itemList.innerHTML = itemDefinitions.map((item) => `
        <button class="item-btn ${state.selected.includes(item.key) ? 'active' : ''}" data-item="${item.key}" type="button" draggable="true">
          <span class="item-icon"><img src="${item.image}" alt="${item.label}" /></span>
          <span>${item.label}</span>
        </button>
      `).join('');

      Array.from(itemList.querySelectorAll('.item-btn')).forEach((btn) => {
        btn.addEventListener('click', () => {
          const item = btn.dataset.item;
          if (state.selected.includes(item)) {
            state.selected = state.selected.filter((x) => x !== item);
          } else {
            state.selected.push(item);
          }
          renderItemButtons();
          renderObjects();
          if (hasGenerated) createShareLink();
        });

        btn.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', btn.dataset.item);
          e.dataTransfer.effectAllowed = 'copy';
        });
      });
    }

    function renderObjects() {
      // Do not render placed items visually on the box; only show them in the list below.
      insideObjects.innerHTML = '';

      const sender = senderInput.value.trim();
      const recipient = recipientInput.value.trim();
      const message = messageInput.value.trim();
      const itemText = (state.inside.length ? state.inside.map(i => itemMap[i.key].label) : state.selected.map(i => itemMap[i].label)).join('、') || '还没有放入任何小物件';
      const cardText = placedCard ? `；已放入贺卡：${cardMap[placedCard.cardKey].label}` : '';
      resultText.innerHTML = `寄件人：${sender || '尚未填写'}<br/>收件人：${recipient || '尚未填写'}<br/>备注：${message || '可选'}<br/>包裹内容：${itemText}${cardText}`;
      updateGenerateState();
    }

    function renderPlacedList() {
      if (!placedList) return;
      const rows = state.inside.map((it, idx) => `
        <div class="placed-row" data-idx="${idx}">
          <img src="${itemMap[it.key].image}" alt="${itemMap[it.key].label}" />
          <div class="label">${itemMap[it.key].label}</div>
          <button data-idx="${idx}" class="remove-btn">删除</button>
        </div>
      `).join('');
      const cardRow = placedCard ? `
        <div class="placed-row placed-card-row">
          <img src="${cardMap[placedCard.cardKey].image}" alt="贺卡" />
          <div class="label">贺卡：${cardMap[placedCard.cardKey].label}</div>
          <button data-card="remove" class="remove-btn">删除</button>
        </div>
      ` : '';
      placedList.innerHTML = rows + cardRow;

      Array.from(placedList.querySelectorAll('.remove-btn')).forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.dataset.card === 'remove') {
            placedCard = null;
          } else {
            const idx = Number(btn.dataset.idx);
            if (!Number.isFinite(idx)) return;
            state.inside.splice(idx, 1);
          }
          renderObjects();
          renderPlacedList();
          createShareLink();
          updateCardState();
        });
      });
    }

    function createShareLink() {
      if (!hasGenerated) {
        shareUrlInput.value = '请先生成包裹后再显示链接';
        qrCodeImg.removeAttribute('src');
        return;
      }

      const sender = senderInput.value.trim();
      const recipient = recipientInput.value.trim();
      const message = messageInput.value.trim();
      const items = state.inside.length ? state.inside.map(i => i.key) : state.selected;
      const url = new URL('gift.html', window.location.href);
      if (sender) url.searchParams.set('from', sender);
      if (recipient) url.searchParams.set('to', recipient);
      if (message) url.searchParams.set('m', message);
      if (items.length) url.searchParams.set('i', items.join(','));
      if (placedCard) {
        url.searchParams.set('card', placedCard.cardKey);
        url.searchParams.set('cardText', placedCard.content);
      }

      shareUrlInput.value = url.toString();
      qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url.toString())}`;
      qrCodeImg.alt = '礼物二维码';
    }


    [senderInput, recipientInput, messageInput].forEach((input) => {
      input.addEventListener('input', () => {
        renderObjects();
        if (hasGenerated) createShareLink();
      });
    });

    cardContentInput.addEventListener('input', () => {
      if (cardContentInput.value.length > 20) {
        cardContentInput.value = cardContentInput.value.slice(0, 20);
      }
      updateCardState();
    });

    placeCardBtn.addEventListener('click', () => {
      if (!selectedCard || !cardContent || placedCard) return;
      placedCard = { cardKey: selectedCard, content: cardContent };
      selectedCard = null;
      cardContentInput.value = '';
      renderCardPicker();
      updateCardState();
      renderObjects();
      renderPlacedList();
      if (hasGenerated) createShareLink();
    });

    if (openCardPicker) {
      openCardPicker.addEventListener('click', () => {
        cardPicker.classList.toggle('active');
      });
    }

    document.getElementById('buildBtn').addEventListener('click', () => {
      const sender = senderInput.value.trim();
      const hasSender = sender.length > 0;
      const hasSelection = state.selected.length > 0 || state.inside.length > 0 || !!placedCard;
      if (!hasSender && !hasSelection) return;
      hasGenerated = true;
      if (innerBox) {
        innerBox.classList.add('open');
        setTimeout(() => innerBox.classList.remove('open'), 500);
      }
      renderObjects();
      createShareLink();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareUrlInput.value);
        document.getElementById('copyBtn').textContent = '已复制';
        setTimeout(() => {
          document.getElementById('copyBtn').textContent = '复制';
        }, 1200);
      } catch (error) {
        console.error(error);
      }
    });

    // toggle single inner box open/close by swapping image
    let boxOpen = false;
    function syncBoxImages() {
      if (innerBox) innerBox.src = boxOpen ? './box_open.png' : './box.png';
      if (innerBox) innerBox.classList.toggle('open', boxOpen);
    }

    if (innerBox) {
      innerBox.addEventListener('click', () => {
        boxOpen = !boxOpen;
        syncBoxImages();
      });
    }

    // drag & drop into inside area
    insideWrap.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    insideWrap.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!boxOpen) return; // only accept drops when box open
      const key = e.dataTransfer.getData('text/plain');
      if (!key) return;
      const rect = insideWrap.getBoundingClientRect();
      const itemW = 44;
      const x = Math.round(e.clientX - rect.left - itemW / 2);
      const y = Math.round(e.clientY - rect.top - itemW / 2);
      state.inside.push({ key, x: Math.max(0, x), y: Math.max(0, y) });
      renderObjects();
      renderPlacedList();
      createShareLink();
    });
    renderCardPicker();
    updateCardState();
    renderItemButtons();
    renderObjects();
    renderPlacedList();
    createShareLink();
  </script>
</body>
</html>
