<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择背景</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fff7f0 0%, #ffe6ef 45%, #f8f8ff 100%);
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .page {
      width: min(100%, 680px);
      background: rgba(255,255,255,0.96);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
      padding: 28px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.9);
    }
    .page h1 {
      margin: 0 0 14px;
      font-size: 30px;
      color: #d63f63;
    }
    .page p {
      margin: 0 0 24px;
      color: #6b7280;
      line-height: 1.8;
      font-size: 16px;
    }
    .background-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .background-card {
      border: 1px solid #f2dbe5;
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      text-align: left;
    }
    .background-card.active {
      border-color: #d63f63;
      box-shadow: 0 0 0 3px rgba(214,63,99,0.14);
      transform: translateY(-2px);
    }
    .background-card img {
      width: 100%;
      height: 108px;
      object-fit: cover;
      display: block;
    }
    .background-card .info {
      padding: 12px 10px 14px;
      color: #3f3f3f;
      font-size: 14px;
      line-height: 1.4;
    }
    .background-card .info strong {
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
      color: #2f2f2f;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn.secondary {
      background: #f8f5f8;
      color: #6b7280;
      border: 1px solid #e5dce2;
    }
    .current-selection {
      margin-bottom: 18px;
      color: #7b6c7a;
      font-size: 14px;
    }
    @media (max-width: 660px) {
      .background-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>选择背景</h1>
    <p>点击一个背景，它会保存并返回编辑页面，接收页面将显示完整背景。</p>
    <div class="current-selection" id="currentSelection">当前已选择：无</div>
    <div class="background-grid" id="backgroundGrid"></div>
    <div class="actions">
      <button class="btn secondary" id="cancelButton" type="button">返回编辑页面</button>
      <button class="btn" id="clearBackground" type="button">清除背景</button>
    </div>
  </div>
  <script>
    const backgroundList = [
      { key: 'foresthouse', label: '森林小屋', image: './background/foresthouse.png' },
      { key: 'room', label: '温馨小房间', image: './background/room.png' },
      { key: 'skyandcloud', label: '蓝天白云', image: './background/skyandcloud.png' }
    ];
    const STORAGE_KEY = 'virtualGiftSelectedBackground';
    const latestKey = localStorage.getItem(STORAGE_KEY) || null;
    const currentSelection = document.getElementById('currentSelection');
    const backgroundGrid = document.getElementById('backgroundGrid');
    const cancelButton = document.getElementById('cancelButton');
    const clearButton = document.getElementById('clearBackground');

    function renderGrid() {
      backgroundGrid.innerHTML = backgroundList.map((bg) => `
        <button class="background-card${latestKey === bg.key ? ' active' : ''}" type="button" data-bg="${bg.key}">
          <img src="${bg.image}" alt="${bg.label}" />
          <div class="info"><strong>${bg.label}</strong>预览图</div>
        </button>
      `).join('');
      currentSelection.textContent = latestKey
        ? `当前已选择：${backgroundList.find((bg) => bg.key === latestKey)?.label || latestKey}`
        : '当前已选择：无';
      Array.from(backgroundGrid.querySelectorAll('.background-card')).forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.bg;
          localStorage.setItem(STORAGE_KEY, key);
          localStorage.removeItem('virtualGiftSelectedBackgroundCleared');
          window.location.href = './index.html';
        });
      });
    }

    cancelButton.addEventListener('click', () => {
      window.location.href = './index.html';
    });

    clearButton.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.setItem('virtualGiftSelectedBackgroundCleared', '1');
      window.location.href = './index.html';
    });

    renderGrid();
  </script>
</body>
</html>
