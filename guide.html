<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分享引导</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(135deg,#fff7f0 0%,#ffe6ef 45%,#f8f8ff 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .page{width:min(680px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 18px 48px rgba(0,0,0,0.12);text-align:left}
    h1{margin:0 0 8px;color:#d63f63;font-size:22px}
    p{color:#4b5563;line-height:1.7;margin:0 0 12px}
    .step{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
    .step .num{width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,#ff7380,#d63f63);color:#fff;display:grid;place-items:center;font-weight:700}
    .note{background:#fff7fb;border:1px solid #f2e6ea;padding:12px;border-radius:12px;color:#4b5563}
    .actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
    .btn.button-secondary{background:#f8f5f8;border:1px solid #e5dce2;color:#6b7280}
  </style>
</head>
<body>
  <div class="page">
    <h1>分享使用说明</h1>
    <p>请根据你正在使用的浏览器选择合适的分享方式：</p>
    <div class="step">
      <div class="num">1</div>
      <div>
        <strong>在微信内：</strong>
        <div class="note">请先在编辑页点击“传送包裹”进入包裹页面，打开包裹后点击右上角“三个点”并选择分享给朋友。</div>
      </div>
    </div>
    <div class="step">
      <div class="num">2</div>
      <div>
        <strong>在其它浏览器或客户端：</strong>
        <div class="note">生成包裹后，会出现二维码。请将二维码图片发送给收件人，收件人扫码即可打开包裹。</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn button-secondary" onclick="history.back()">返回编辑</button>
      <a class="btn" href="index.html">回到主页</a>
    </div>
  </div>
</body>
</html>
