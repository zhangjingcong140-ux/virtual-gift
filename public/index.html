<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>打包你的专属包裹</title>
    <!-- 引入生成二维码的库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, textarea, select, button { width: 90%; margin: 10px 0; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #ff6b6b; color: white; border: none; cursor: pointer; font-weight: bold; }
        #result { margin-top: 20px; display: none; }
        #qrcode { margin: 15px auto; width: 128px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎁 制作神秘包裹</h2>
        <input type="text" id="sender" placeholder="你的名字" required>
        <textarea id="message" rows="3" placeholder="想对Ta说的话..." required></textarea>
        <select id="color">
            <option value="#ff9ff3">粉色浪漫</option>
            <option value="#54a0ff">蓝色星空</option>
            <option value="#1dd1a1">绿色清新</option>
        </select>
        <button onclick="createGift()">生成包裹</button>

        <div id="result">
            <p>✅ 生成成功！快把下面的链接或二维码发给Ta吧：</p>
            <input type="text" id="giftUrl" readonly>
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        async function createGift() {
            const sender = document.getElementById('sender').value;
            const message = document.getElementById('message').value;
            const color = document.getElementById('color').value;

            if(!sender || !message) return alert("请填写名字和留言哦！");

            const response = await fetch('/api/pack', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senderName: sender, message: message, boxColor: color })
            });
            const data = await response.json();

            if(data.success) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('giftUrl').value = data.url;
                
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: data.url,
                    width: 128,
                    height: 128
                });
            }
        }
    </script>
</body>
</html>
