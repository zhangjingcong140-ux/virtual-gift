<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>更多小物件</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body {
      background: radial-gradient(circle at top, #fff7f0 0%, #ffe6ef 45%, #f8f8ff 100%);
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .page {
      width: min(100%, 560px);
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.12);
      padding: 28px 24px;
      text-align: center;
    }
    .page h1 {
      margin: 0 0 16px;
      font-size: 28px;
      color: #d63f63;
    }
    .page p {
      margin: 0 0 24px;
      color: #6b7280;
      line-height: 1.8;
      font-size: 16px;
    }
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #d63f63;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn.secondary {
      background: #f8f5f8;
      color: #6b7280;
      border: 1px solid #e5dce2;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>更多小物件</h1>
    <p>这是“更多”页面，后续你可以在这里添加新的可选小物件。当前仅作为入口页面存在。</p>
    <div class="btn-row">
      <a class="btn secondary" href="./index.html">返回编辑页面</a>
      <a class="btn" href="./index.html">继续编辑包裹</a>
    </div>
  </div>
</body>
</html>
