<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>更多小物件</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="3D神秘包裹" />
  <meta property="og:image" content="./sharecover.png" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body {
      background: radial-gradient(circle at top, #fff7f0 0%, #ffe6ef 45%, #f8f8ff 100%);
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .page {
      width: min(100%, 560px);
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.12);
      padding: 28px 24px;
      text-align: center;
    }
    .page h1 {
      margin: 0 0 16px;
      font-size: 28px;
      color: #d63f63;
    }
    .page p {
      margin: 0 0 24px;
      color: #6b7280;
      line-height: 1.8;
      font-size: 16px;
    }
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .item-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 12px;
      border-radius: 18px;
      border: 1px solid #f2dbe5;
      background: #fff;
      color: #2f2f2f;
      font-size: 15px;
      cursor: pointer;
      min-height: 68px;
    }
    .item-btn .item-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #fff2f8;
      font-size: 20px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #d63f63;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn.secondary {
      background: #f8f5f8;
      color: #6b7280;
      border: 1px solid #e5dce2;
    }
    @media (max-width: 520px) {
      .item-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script>
    function addMoreItem(itemKey) {
      const extra = JSON.parse(localStorage.getItem('virtualGiftMoreItems') || '[]');
      extra.push(itemKey);
      localStorage.setItem('virtualGiftMoreItems', JSON.stringify(extra));
      window.location.href = './index.html';
    }
  </script>
</head>
<body>
  <div class="page">
    <h1>更多小物件</h1>
    <p>点击即可将小物件加入包裹，返回编辑页面后会显示在可删除列表中。</p>
    <div class="item-grid">
      <button class="item-btn" type="button" onclick="addMoreItem('orangecat')">
        <span class="item-icon"><img src="./more/cats/orangecat.png" alt="橘猫" /></span>
        <span>橘猫</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('graycat')">
        <span class="item-icon"><img src="./more/cats/graycat.png" alt="灰猫" /></span>
        <span>灰猫</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('whitecat')">
        <span class="item-icon"><img src="./more/cats/whitecat.png" alt="白猫" /></span>
        <span>白猫</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('cowcat')">
        <span class="item-icon"><img src="./more/cats/cowcat.png" alt="奶牛猫" /></span>
        <span>奶牛猫</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('yellowdog')">
        <span class="item-icon"><img src="./more/cats/dogs/yellowdog.png" alt="黄色小狗" /></span>
        <span>黄色小狗</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('graydog')">
        <span class="item-icon"><img src="./more/cats/dogs/graydog.png" alt="灰色小狗" /></span>
        <span>灰色小狗</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('charliedog')">
        <span class="item-icon"><img src="./more/cats/dogs/charliedog.png" alt="查理狗" /></span>
        <span>查理狗</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('balloon')">
        <span class="item-icon"><img src="./more/balloon.png" alt="气球" /></span>
        <span>气球</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('bomb')">
        <span class="item-icon"><img src="./more/bomb.png" alt="炸弹" /></span>
        <span>炸弹</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('fu')">
        <span class="item-icon"><img src="./more/fu.png" alt="福字" /></span>
        <span>福字</span>
      </button>
      <button class="item-btn" type="button" onclick="addMoreItem('violet')">
        <span class="item-icon"><img src="./more/violet.png" alt="紫罗兰" /></span>
        <span>紫罗兰</span>
      </button>
    </div>
    <div class="btn-row">
      <a class="btn secondary" href="./index.html">返回编辑页面</a>
      <a class="btn" href="./index.html">继续编辑包裹</a>
    </div>
  </div>
</body>
</html>
