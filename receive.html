<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你收到一份神秘包裹</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="你收到了一个包裹" />
  <meta property="og:image" content="https://zhangjingcong140-ux.github.io/virtual-gift/sharecover.png" />
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #fff7f0 0%, #ffe6ef 45%, #f8f8ff 100%);
      color: #2f2f2f;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .gift-card {
      position: relative;
      width: min(100%, 460px);
      background: transparent;
      border: none;
      backdrop-filter: blur(18px);
      border-radius: 24px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.16);
      padding: 28px 24px;
      text-align: center;
      z-index: 2;
      pointer-events: auto;
    }
    .gift-title {
      font-size: 24px;
      font-weight: 800;
      color: #d63f63;
      margin-bottom: 6px;
    }
    .gift-subtitle {
      color: #6b7280;
      margin-bottom: 18px;
    }
    .gift-box {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 18px;
      cursor: pointer;
      transition: transform .35s ease;
      display: grid;
      place-items: center;
    }
    .now-playing {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: transparent;
      z-index: 8;
      transition: opacity .25s ease;
      opacity: 0;
      pointer-events: none;
    }
    .now-playing img { width: 100%; height: 100%; object-fit: contain; }
    .now-playing.spin {
      opacity: 1;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      from { transform: translateX(-50%) rotate(0deg); }
      to { transform: translateX(-50%) rotate(360deg); }
    }
    .gift-box img { width: 100%; height: 100%; object-fit: contain; }
    .message-card {
      margin: 14px 0 10px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      color: #4b5563;
      line-height: 1.6;
    }
    .item-row {
      position: relative;
      min-height: 120px;
      margin-top: 14px;
      margin-bottom: 28px;
      padding-top: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 18px;
      scroll-behavior: smooth;
      overscroll-behavior-x: contain;
    }
    .item-row::-webkit-scrollbar {
      height: 8px;
    }
    .item-row::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.18);
      border-radius: 999px;
    }
    .item-chip {
      position: absolute;
      width: 72px;
      height: 92px;
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 6px 8px;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -50%) scale(0.8);
      transition: all .45s cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 6px 14px rgba(0,0,0,0.12);
      z-index: 60;
      pointer-events: none;
    }
    .item-chip.show {
      opacity: 1;
      visibility: visible;
      transform: translate(0, 0) scale(1);
    }
    .item-chip img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .top-left-btn {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 30;
      background: white;
      color: #d63f63;
      border: 1px solid #f2dbe5;
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    .item-chip img { width: 56px; height: 56px; object-fit: contain; display: block; }
    .item-label {
      font-size: 12px;
      color: #4b5563;
      text-align: center;
      line-height: 1.1;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-detail {
      margin-top: 28px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
      text-align: center;
    }
    .card-note {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      min-height: 1.4em;
    }
    .card-view {
      display: grid;
      gap: 10px;
      justify-items: center;
      margin-top: 10px;
    }
    .card-view.hidden {
      display: none;
    }
    .card-view img {
      width: 140px;
      border-radius: 16px;
      object-fit: contain;
    }
    .card-text {
      max-width: 280px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.85);
      color: #7b4b66;
      font-size: 16px;
      font-weight: 700;
      border-radius: 24px;
      pointer-events: auto;
      z-index: 10;
    }
    .loading-overlay.hidden {
      display: none;
    }
    .gift-box.loading {
      pointer-events: none;
    }
    .item-chip.show {
      opacity: 1;
      visibility: visible;
      transform: translate(0, 0) scale(1);
    }
    .item-chip img { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <a href="./index.html" class="top-left-btn">制作包裹</a>
  
  <div class="gift-card">
    <div class="gift-title">你收到一份神秘包裹</div>
    <div class="gift-subtitle">点击礼盒，看看里面藏了什么</div>
    <div class="gift-box loading" id="giftBox">
      <div class="now-playing" id="nowPlayingCd"><img src="./cd.png" alt="CD" /></div>
      <img id="giftBoxImg" src="./box.png" alt="包裹" />
      <div class="loading-overlay" id="loadingOverlay">加载中...</div>
    </div>
    <div class="message-card">
      <div id="sender-name">来自：神秘好友</div>
      <div id="recipient-name">致：</div>
      <div id="gift-message">这里会显示你的备注。</div>
    </div>
    <div class="item-row" id="itemRow"></div>
    <div class="card-detail" id="cardDetail">
      <div class="card-note" id="cardNote"></div>
      <div class="card-view hidden" id="cardView">
        <img id="cardImg" src="" alt="贺卡" />
        <div class="card-text" id="cardText"></div>
      </div>
    </div>
  </div>

  <script>
    const itemMap = {
      rose: '<img src="./rose.png" alt="玫瑰" />',
      bug: '<img src="./bug.png" alt="虫子" />',
      shit: '<img src="./shit.png" alt="大便" />',
      firefly: '<img src="./firefly.png" alt="萤火虫" />',
      confetti: '<img src="./saluting_gun.png" alt="礼炮" />',
      cake: '<img src="./cake.png" alt="蛋糕" />',
      orangecat: '<img src="./more/cats/orangecat.png" alt="橘猫" />',
      graycat: '<img src="./more/cats/graycat.png" alt="灰猫" />',
      whitecat: '<img src="./more/cats/whitecat.png" alt="白猫" />',
      cowcat: '<img src="./more/cats/cowcat.png" alt="奶牛猫" />',
      yellowdog: '<img src="./more/cats/dogs/yellowdog.png" alt="黄色小狗" />',
      graydog: '<img src="./more/cats/dogs/graydog.png" alt="灰色小狗" />',
      charliedog: '<img src="./more/cats/dogs/charliedog.png" alt="查理狗" />',
      balloon: '<img src="./more/balloon.png" alt="气球" />',
      bomb: '<img src="./more/bomb.png" alt="炸弹" />',
      fu: '<img src="./more/fu.png" alt="福字" />',
      violet: '<img src="./more/violet.png" alt="紫罗兰" />',
      cd: '<img src="./cd.png" alt="CD" />'
    };
    const boxStyleMap = {
      classic: {
        closed: './box.png',
        open: './box_open.png',
        pet: './petbox.png'
      },
      leather: {
        closed: './leatherbox.png',
        open: './leatherbox_open.png',
        pet: './petleatherbox.png'
      },
      mc: {
        closed: './mcbox.png',
        open: './mcbox_open.png',
        pet: './petmcbox.png'
      }
    };
    const itemNames = {
      rose: '玫瑰',
      bug: '虫子',
      shit: '大便',
      firefly: '萤火虫',
      confetti: '礼炮',
      cake: '蛋糕',
      orangecat: '橘猫',
      graycat: '灰猫',
      whitecat: '白猫',
      cowcat: '奶牛猫',
      yellowdog: '黄色小狗',
      graydog: '灰色小狗',
      charliedog: '查理狗',
      balloon: '气球',
      bomb: '炸弹',
      fu: '福字',
      violet: '紫罗兰',
      cd: 'CD'
    };
    const cdLabels = {
      qingtian: '晴天',
      luohualiushui: '落花流水',
      jifenzhiji: '几分之几',
      kezaiwoxindidemingzi: '刻在我心底的名字',
      jiushiaini: '就是爱你',
      kgezhiwang: 'K歌之王',
      jimodejijie: '寂寞的季节',
      aicuo: '爱错',
      geqian: '搁浅',
      nibawoguanzui: '你把我灌醉',
      suiyueruge: '岁月如歌',
      yongbeijichangqingge: '用背脊唱情歌',
      yueding: '约定',
      aiwohaishita: '爱我还是他',
      aihenjiandan: '爱很简单',
      shimianmaifu: '十面埋伏'
    };

    function decodeLegacyGiftData(text) {
      const binary = atob(text);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const compressedData = params.get('d');
      const legacyData = params.get('data');
      const sender = params.get('from') || params.get('r');
      const recipient = params.get('to') || params.get('t');
      const message = params.get('m');
      const legacyText = params.get('text');
      const style = params.get('s');
      const items = (params.get('i') || '').split(',').filter(Boolean);
      const cardKey = params.get('card');
      const cardText = params.get('cardText') || '';
      const giftCd = params.get('cd');
      const boxStyleParam = params.get('boxStyle');

      if (!compressedData && !legacyData && !sender && !recipient && !message && !legacyText && !items.length && !cardKey && !giftCd) {
        document.getElementById('gift-message').textContent = '没有找到包裹信息哦！';
        return;
      }

      try {
        let gift;
        if (compressedData) {
          const decompressed = LZString.decompressFromEncodedURIComponent(compressedData);
          gift = decompressed ? JSON.parse(decompressed) : null;
        } else if (legacyData) {
          gift = decodeLegacyGiftData(legacyData);
        } else {
          gift = { sender, recipient, message: legacyText || message || '', style, items, card: cardKey, cardText };
        }
        if (!gift) throw new Error('无法解析包裹信息');
        if (!gift.sender && gift.recipient && !params.get('to')) gift.sender = gift.recipient;
        document.getElementById('sender-name').textContent = `来自：${gift.sender || '神秘好友'}`;
        document.getElementById('recipient-name').textContent = `致：${gift.recipient || ''}`;
        document.getElementById('gift-message').textContent = '备注：' + (gift.message || '这个包裹里没有写备注。');
        window.giftBoxStyle = gift.boxStyle || boxStyleParam || gift.style || 'classic';
        const currentStyle = boxStyleMap[window.giftBoxStyle] || boxStyleMap.classic;
        if (giftBoxImg) giftBoxImg.src = currentStyle.closed;
        const itemRow = document.getElementById('itemRow');
        itemRow.innerHTML = '';
        window.giftItems = gift.items || [];
        window.giftCard = gift.card || cardKey || null;
        window.giftCardText = gift.cardText || cardText || '';
        window.giftCd = gift.cd || giftCd || null;
        const cardNote = document.getElementById('cardNote');
        const cardView = document.getElementById('cardView');
        const cardImg = document.getElementById('cardImg');
        const cardTextEl = document.getElementById('cardText');
        if (window.giftCard) {
          cardNote.textContent = '你收到了一张贺卡，打开包裹查看内容。';
          cardImg.src = `./cards/${window.giftCard}.png`;
          cardTextEl.textContent = window.giftCardText || '未填写内容';
          cardView.classList.add('hidden');
        } else {
          cardNote.textContent = window.giftCd ? '你收到了一张CD，打开包裹就会播放音乐。' : '';
          cardView.classList.add('hidden');
        }
        if (window.giftCard && window.giftCd) {
          cardNote.textContent = '你收到了一张贺卡和一张CD，打开包裹查看内容并播放音乐。';
        }
        if (window.giftCd) {
          window.giftAudio = new Audio(`./CDs/${window.giftCd}.mp3`);
          window.giftAudio.preload = 'auto';
        }
        
      } catch (error) {
        console.error(error);
        document.getElementById('gift-message').textContent = '包裹内容损坏了~';
      }
    };

    const giftBox = document.getElementById('giftBox');
    const giftBoxImg = document.getElementById('giftBoxImg');
    const loadingOverlay = document.getElementById('loadingOverlay');
    let hasOpened = false;
    let canOpen = false;

    setTimeout(() => {
      if (loadingOverlay) loadingOverlay.classList.add('hidden');
      if (giftBox) giftBox.classList.remove('loading');
      canOpen = true;
    }, 4000);

    giftBox.addEventListener('click', () => {
      if (!canOpen || hasOpened) return;
      if (hasOpened) return;
      hasOpened = true;
      giftBox.classList.add('open');
      const petKeys = ['orangecat', 'graycat', 'whitecat', 'cowcat', 'yellowdog', 'graydog', 'charliedog'];
      const hasPet = (window.giftItems || []).some((item) => petKeys.includes(item));
      const currentStyle = boxStyleMap[window.giftBoxStyle] || boxStyleMap.classic;
      if (giftBoxImg) giftBoxImg.src = hasPet ? currentStyle.pet : currentStyle.open;
      if (window.giftCd) {
        if (!window.giftAudio) {
          window.giftAudio = new Audio(`./CDs/${window.giftCd}.mp3`);
          window.giftAudio.preload = 'auto';
        }
        window.giftAudio.currentTime = 0;
        const nowEl = document.getElementById('nowPlayingCd');
        const startPlay = () => {
          window.giftAudio.play().then(() => {
            if (nowEl) nowEl.classList.add('spin');
          }).catch((err) => {
            console.warn('音频播放失败:', err);
            if (nowEl) nowEl.classList.remove('spin');
          });
        };
        startPlay();
        // keep UI in sync with audio state
        window.giftAudio.addEventListener('play', () => { const el = document.getElementById('nowPlayingCd'); if (el) el.classList.add('spin'); });
        window.giftAudio.addEventListener('pause', () => { const el = document.getElementById('nowPlayingCd'); if (el) el.classList.remove('spin'); });
        window.giftAudio.addEventListener('ended', () => { const el = document.getElementById('nowPlayingCd'); if (el) el.classList.remove('spin'); });
      }

      const itemRow = document.getElementById('itemRow');
      itemRow.innerHTML = '';
      const chips = (window.giftItems || []).map((item) => {
        const el = document.createElement('div');
        el.className = 'item-chip';
        const imgHtml = itemMap[item] || itemMap.rose;
        const label = itemNames[item] || '';
        el.innerHTML = imgHtml + `<div class="item-label">${label}</div>`;
        return el;
      });
      chips.forEach((chip) => itemRow.appendChild(chip));
      if (window.giftCard) {
        const el = document.createElement('div');
        el.className = 'item-chip';
        el.innerHTML = `<img src="./cards/${window.giftCard}.png" alt="贺卡" /><div class="item-label">贺卡</div>`;
        itemRow.appendChild(el);
      }
      if (window.giftCd) {
        const el = document.createElement('div');
        el.className = 'item-chip';
        const label = cdLabels[window.giftCd] || 'CD';
        el.innerHTML = `<img src="./cd.png" alt="CD" /><div class="item-label">CD：${label}</div>`;
        itemRow.appendChild(el);
      }
      if (!chips.length && !window.giftCard && !window.giftCd) return;

      const cardView = document.getElementById('cardView');
      if (window.giftCard) cardView.classList.remove('hidden');

      const rowRect = itemRow.getBoundingClientRect();
      const boxRect = giftBox.getBoundingClientRect();
      const startX = boxRect.left - rowRect.left + boxRect.width / 2;
      const startY = boxRect.top - rowRect.top + boxRect.height / 2;
      const chipW = 56;
      const chipGap = 12;
      const totalW = chips.length * chipW + Math.max(0, chips.length - 1) * chipGap;
      const baseX = Math.max(12, (rowRect.width - totalW) / 2);
      const baseY = 10;

      chips.forEach((chip, index) => {
        chip.style.left = `${startX}px`;
        chip.style.top = `${startY}px`;
        chip.style.opacity = '0';
        chip.style.transform = 'translate(-50%, -50%) scale(0.8)';
        setTimeout(() => {
          chip.style.left = `${baseX + index * (chipW + chipGap)}px`;
          chip.style.top = `${baseY}px`;
          chip.style.opacity = '1';
          chip.style.transform = 'translate(0, 0) scale(1)';
          chip.classList.add('show');
        }, 120 * index);
      });
    });
  </script>
</body>
</html>
