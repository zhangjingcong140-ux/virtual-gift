<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你收到一份神秘包裹</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #fff7f0 0%, #ffe6ef 45%, #f8f8ff 100%);
      color: #2f2f2f;
    }
    .gift-card {
      position: relative;
      width: min(100%, 460px);
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.16);
      padding: 28px 24px;
      text-align: center;
    }
    .gift-title {
      font-size: 24px;
      font-weight: 800;
      color: #d63f63;
      margin-bottom: 6px;
    }
    .gift-subtitle {
      color: #6b7280;
      margin-bottom: 18px;
    }
    .gift-box {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 18px;
      cursor: pointer;
      transition: transform .35s ease;
      display: grid;
      place-items: center;
    }
    .gift-box img { width: 100%; height: 100%; object-fit: contain; }
    .message-card {
      margin: 14px 0 10px;
      padding: 12px;
      border-radius: 14px;
      background: #fff7fb;
      border: 1px dashed #e7c8d7;
      color: #4b5563;
      line-height: 1.6;
    }
    .item-row {
      position: relative;
      min-height: 90px;
      margin-top: 14px;
      padding-top: 8px;
      overflow: hidden;
    }
    .item-chip {
      position: absolute;
      width: 72px;
      height: 92px;
      border-radius: 14px;
      background: #fff7fb;
      border: 1px dashed #e8d0dc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 6px 8px;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -50%) scale(0.8);
      transition: all .45s cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      z-index: 5;
      pointer-events: none;
    }
    .item-chip.show {
      opacity: 1;
      visibility: visible;
      transform: translate(0, 0) scale(1);
    }
    .item-chip img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .item-chip img { width: 56px; height: 56px; object-fit: contain; display: block; }
    .item-label {
      font-size: 12px;
      color: #4b5563;
      text-align: center;
      line-height: 1.1;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-detail {
      margin-top: 14px;
      padding: 14px;
      border-radius: 18px;
      background: #fff7fb;
      border: 1px dashed #e8d0dc;
      text-align: center;
    }
    .card-note {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      min-height: 1.4em;
    }
    .card-view {
      display: grid;
      gap: 10px;
      justify-items: center;
      margin-top: 10px;
    }
    .card-view.hidden {
      display: none;
    }
    .card-view img {
      width: 140px;
      border-radius: 16px;
      object-fit: contain;
    }
    .card-text {
      max-width: 280px;
      padding: 12px 14px;
      border-radius: 14px;
      background: white;
      border: 1px solid #f2dbe5;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.85);
      color: #7b4b66;
      font-size: 16px;
      font-weight: 700;
      border-radius: 24px;
      pointer-events: auto;
      z-index: 10;
    }
    .loading-overlay.hidden {
      display: none;
    }
    .gift-box.loading {
      pointer-events: none;
    }
    .item-chip.show {
      opacity: 1;
      visibility: visible;
      transform: translate(0, 0) scale(1);
    }
    .item-chip img { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <div class="gift-card">
    <div class="gift-title">你收到一份神秘包裹</div>
    <div class="gift-subtitle">点击礼盒，看看里面藏了什么</div>
    <div class="gift-box loading" id="giftBox">
      <img id="giftBoxImg" src="./box.png" alt="包裹" />
      <div class="loading-overlay" id="loadingOverlay">加载中...</div>
    </div>
    <div class="message-card">
      <div id="sender-name">来自：神秘好友</div>
      <div id="recipient-name">致：</div>
      <div id="gift-message">这里会显示你的备注。</div>
    </div>
    <div class="item-row" id="itemRow"></div>
    <div class="card-detail" id="cardDetail">
      <div class="card-note" id="cardNote"></div>
      <div class="card-view hidden" id="cardView">
        <img id="cardImg" src="" alt="贺卡" />
        <div class="card-text" id="cardText"></div>
      </div>
    </div>
  </div>

  <script>
    const itemMap = {
      rose: '<img src="./rose.png" alt="玫瑰" />',
      bug: '<img src="./bug.png" alt="虫子" />',
      shit: '<img src="./shit.png" alt="大便" />',
      firefly: '<img src="./firefly.png" alt="萤火虫" />',
      confetti: '<img src="./saluting_gun.png" alt="礼炮" />',
      cake: '<img src="./cake.png" alt="蛋糕" />'
    };
    const itemNames = {
      rose: '玫瑰',
      bug: '虫子',
      shit: '大便',
      firefly: '萤火虫',
      confetti: '礼炮',
      cake: '蛋糕'
    };

    function decodeLegacyGiftData(text) {
      const binary = atob(text);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const legacyData = params.get('data');
      const sender = params.get('from') || params.get('r');
      const recipient = params.get('to') || params.get('t');
      const message = params.get('m');
      const style = params.get('s');
      const items = (params.get('i') || '').split(',').filter(Boolean);
      const cardKey = params.get('card');
      const cardText = params.get('cardText') || '';

      if (!legacyData && !sender && !recipient && !message && !items.length && !cardKey) {
        document.getElementById('gift-message').textContent = '没有找到包裹信息哦！';
        return;
      }

      try {
        let gift = legacyData ? decodeLegacyGiftData(legacyData) : { sender, recipient, message, style, items };
        // backward compatibility: older payloads may have used `recipient` as the sender
        if (!gift.sender && gift.recipient && !params.get('to')) gift.sender = gift.recipient;
        document.getElementById('sender-name').textContent = `来自：${gift.sender || '神秘好友'}`;
        document.getElementById('recipient-name').textContent = `致：${gift.recipient || ''}`;
        document.getElementById('gift-message').textContent = gift.message || '这个包裹里没有写备注。';
        const itemRow = document.getElementById('itemRow');
        itemRow.innerHTML = '';
        window.giftItems = gift.items || [];
        window.giftCard = gift.card || cardKey || null;
        window.giftCardText = gift.cardText || cardText || '';
        const cardNote = document.getElementById('cardNote');
        const cardView = document.getElementById('cardView');
        const cardImg = document.getElementById('cardImg');
        const cardTextEl = document.getElementById('cardText');
        if (window.giftCard) {
          cardNote.textContent = '你收到了一张贺卡，打开包裹查看内容。';
          cardImg.src = `./cards/${window.giftCard}.png`;
          cardTextEl.textContent = window.giftCardText || '未填写内容';
          cardView.classList.add('hidden');
        } else {
          cardNote.textContent = '';
          cardView.classList.add('hidden');
        }
      } catch (error) {
        console.error(error);
        document.getElementById('gift-message').textContent = '包裹内容损坏了~';
      }
    };

    const giftBox = document.getElementById('giftBox');
    const giftBoxImg = document.getElementById('giftBoxImg');
    const loadingOverlay = document.getElementById('loadingOverlay');
    let hasOpened = false;
    let canOpen = false;

    setTimeout(() => {
      if (loadingOverlay) loadingOverlay.classList.add('hidden');
      if (giftBox) giftBox.classList.remove('loading');
      canOpen = true;
    }, 3000);

    giftBox.addEventListener('click', () => {
      if (!canOpen || hasOpened) return;
      if (hasOpened) return;
      hasOpened = true;
      giftBox.classList.add('open');
      if (giftBoxImg) giftBoxImg.src = './box_open.png';

      const itemRow = document.getElementById('itemRow');
      itemRow.innerHTML = '';
      const chips = (window.giftItems || []).map((item) => {
        const el = document.createElement('div');
        el.className = 'item-chip';
        const imgHtml = itemMap[item] || itemMap.rose;
        const label = itemNames[item] || '';
        el.innerHTML = imgHtml + `<div class="item-label">${label}</div>`;
        return el;
      });
      chips.forEach((chip) => itemRow.appendChild(chip));
      if (window.giftCard) {
        const el = document.createElement('div');
        el.className = 'item-chip';
        el.innerHTML = `<img src="./cards/${window.giftCard}.png" alt="贺卡" /><div class="item-label">贺卡</div>`;
        itemRow.appendChild(el);
      }
      if (!chips.length && !window.giftCard) return;

      const cardView = document.getElementById('cardView');
      if (window.giftCard) cardView.classList.remove('hidden');

      const rowRect = itemRow.getBoundingClientRect();
      const boxRect = giftBox.getBoundingClientRect();
      const startX = boxRect.left - rowRect.left + boxRect.width / 2;
      const startY = boxRect.top - rowRect.top + boxRect.height / 2;
      const chipW = 56;
      const chipGap = 12;
      const totalW = chips.length * chipW + Math.max(0, chips.length - 1) * chipGap;
      const baseX = Math.max(12, (rowRect.width - totalW) / 2);
      const baseY = 10;

      chips.forEach((chip, index) => {
        chip.style.left = `${startX}px`;
        chip.style.top = `${startY}px`;
        chip.style.opacity = '0';
        chip.style.transform = 'translate(-50%, -50%) scale(0.8)';
        setTimeout(() => {
          chip.style.left = `${baseX + index * (chipW + chipGap)}px`;
          chip.style.top = `${baseY}px`;
          chip.style.opacity = '1';
          chip.style.transform = 'translate(0, 0) scale(1)';
          chip.classList.add('show');
        }, 120 * index);
      });
    });
  </script>
</body>
</html>
